<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MMSE</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F2F3F7;--white:#FFF;--ink:#1A1A1A;--muted:#9A9A9F;--line:#E0E2EA;
  --accent:#1D6AE5;--on:#1D6AE5;--on-lt:#E8F0FD;
  --green:#15803D;--green-lt:#F0FDF4;
  --amber:#B45309;--amber-lt:#FFFBEB;
  --red:#B91C1C;--red-lt:#FEF2F2;
}
html,body{height:100%;background:var(--bg);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--ink);}
.screen{display:none;flex-direction:column;align-items:center;min-height:100%;padding-bottom:1rem;}
.screen.active{display:flex;}

/* HOME */
#home{padding:0 1rem;}
.home-hdr{width:100%;max-width:480px;padding:1.5rem 0 1rem;display:flex;align-items:baseline;justify-content:space-between;}
.home-hdr h1{font-size:1.2rem;font-weight:700;}
.home-hdr .sub{font-size:.72rem;color:var(--muted);}
.field{width:100%;max-width:480px;margin-bottom:.7rem;}
.field label{display:block;font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:.3rem;}
.field input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:1rem;background:var(--white);color:var(--ink);outline:none;}
.field input:focus{border-color:var(--accent);}
.go-btn{width:100%;max-width:480px;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:1.5rem;}

/* LOG */
.log-hdr{width:100%;max-width:480px;font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:.5rem;}
.log-empty{width:100%;max-width:480px;text-align:center;color:var(--muted);font-size:.85rem;padding:1rem 0;}
.log-row{
  width:100%;max-width:480px;background:var(--white);border-radius:12px;
  padding:.75rem 1rem;margin-bottom:.45rem;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;
}
.log-row:active{opacity:.7;}
.log-left .ini{font-size:1rem;font-weight:700;}
.log-left .dt{font-size:.72rem;color:var(--muted);margin-top:.1rem;}
.log-right{text-align:right;}
.log-sc{font-size:1.3rem;font-weight:700;}
.log-sc.hi{color:var(--green);}
.log-sc.mid{color:var(--amber);}
.log-sc.lo{color:var(--red);}
.log-tag{font-size:.62rem;font-weight:600;padding:2px 7px;border-radius:99px;margin-top:.2rem;display:inline-block;}
.tag-hi{background:var(--green-lt);color:var(--green);}
.tag-mid{background:var(--amber-lt);color:var(--amber);}
.tag-lo{background:var(--red-lt);color:var(--red);}

/* EXAM */
#exam{padding:0 .75rem;}
.exam-hdr{
  width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 0 .45rem;border-bottom:1px solid var(--line);margin-bottom:.45rem;
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.exam-hdr .who{font-size:.9rem;font-weight:700;}
.exam-hdr .dt2{font-size:.62rem;color:var(--muted);}
.exam-hdr .live{font-size:1rem;font-weight:700;color:var(--accent);}
.quit{background:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.68rem;font-family:inherit;color:var(--muted);cursor:pointer;}

/* セクションラベル：横並びで項目の前に小さく */
.sec-label{
  width:100%;max-width:480px;
  font-size:.58rem;font-weight:700;letter-spacing:.1em;color:var(--muted);
  margin:.4rem 0 .2rem;
}

/* ITEM ROW */
.item-row{
  width:100%;max-width:480px;background:var(--white);border-radius:8px;
  padding:.42rem .75rem;margin-bottom:.22rem;
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  cursor:pointer;user-select:none;
  border:2px solid transparent;
  transition:background .12s, border-color .12s;
}
.item-row.on{background:var(--on-lt);border-color:var(--on);}
.item-row:active{opacity:.75;}
.item-text{font-size:.8rem;color:var(--ink);flex:1;line-height:1.3;}
.item-row.on .item-text{font-weight:600;color:var(--on);}
.item-check{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:.85rem;color:transparent;background:var(--white);
  transition:all .12s;
}
.item-row.on .item-check{background:var(--on);border-color:var(--on);color:#fff;}

/* PARTIAL ROW */
.partial-row{
  width:100%;max-width:480px;background:var(--white);border-radius:8px;
  padding:.42rem .75rem;margin-bottom:.22rem;
  display:flex;align-items:center;gap:.6rem;
}
.partial-label{font-size:.8rem;color:var(--ink);flex:1;}
.partial-val{font-size:.85rem;font-weight:700;color:var(--on);white-space:nowrap;}
.partial-btns{display:flex;gap:.28rem;}
.pt-btn{
  width:30px;height:30px;border:1.5px solid var(--line);border-radius:7px;
  background:var(--white);font-family:inherit;font-size:.82rem;font-weight:600;
  color:var(--muted);cursor:pointer;text-align:center;transition:all .12s;
  display:flex;align-items:center;justify-content:center;
}
.pt-btn.sel{background:var(--on);border-color:var(--on);color:#fff;}

/* CALC ROW */
.calc-wrap{
  width:100%;max-width:480px;background:var(--white);border-radius:8px;
  padding:.5rem .75rem .55rem;margin-bottom:.22rem;
}
.calc-answers{
  display:flex;gap:.4rem;margin-bottom:.45rem;align-items:center;
}
.calc-ans-item{
  display:flex;flex-direction:column;align-items:center;gap:.15rem;flex:1;
}
.calc-ans-num{font-size:.68rem;color:var(--muted);font-weight:600;}
.calc-ox-btn{
  width:100%;height:32px;border-radius:7px;border:1.5px solid var(--line);
  background:var(--white);font-size:.9rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;font-family:inherit;
}
.calc-ox-btn.ok{background:#DCFCE7;border-color:#16A34A;color:#15803D;}
.calc-ox-btn.ng{background:#FEE2E2;border-color:#DC2626;color:#B91C1C;}
.calc-row-bottom{
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--line);padding-top:.4rem;
}
.calc-score-label{font-size:.72rem;color:var(--muted);}
.calc-ptns{display:flex;gap:.28rem;align-items:center;}
.calc-total-val{font-size:.85rem;font-weight:700;color:var(--on);margin-right:.35rem;}

/* BOTTOM BAR */
.bot-bar{
  position:sticky;bottom:0;
  background:var(--white);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 1rem;z-index:20;
  width:100%;max-width:480px;margin-top:.5rem;
}
.bot-total{display:flex;align-items:baseline;gap:.3rem;}
.bot-total .big{font-size:1.7rem;font-weight:700;color:var(--accent);line-height:1;}
.bot-total .denom{font-size:.75rem;color:var(--muted);}
.done-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;}

/* RESULT */
#result{padding:0 1rem;}
.res-hero{
  width:100%;max-width:480px;border-radius:0 0 16px 16px;
  padding:1.75rem 1.25rem 1.5rem;text-align:center;color:#fff;margin-bottom:1rem;
  background:var(--accent);
}
.res-ini{font-size:.82rem;opacity:.85;margin-bottom:.25rem;}
.res-big{font-size:4.5rem;font-weight:700;line-height:1;}
.res-of{font-size:.9rem;opacity:.75;margin-bottom:.3rem;}
.res-judge{font-size:.9rem;font-weight:600;}
.res-dt{font-size:.72rem;opacity:.7;margin-top:.2rem;}

.det-sec{width:100%;max-width:480px;margin-bottom:.5rem;}
.det-sec-lbl{font-size:.65rem;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:.3rem;}
.det-row{
  background:var(--white);border-radius:10px;
  padding:.65rem .9rem;margin-bottom:.3rem;
  display:flex;align-items:center;justify-content:space-between;
}
.det-q{font-size:.83rem;color:var(--ink);}
.det-sc{font-size:.9rem;font-weight:700;}
.det-sc.hi{color:var(--green);}
.det-sc.lo{color:var(--red);}
.det-sc.mid{color:var(--amber);}

.act-col{width:100%;max-width:480px;display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem;}
.act-btn{width:100%;padding:14px;border-radius:11px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;border:none;}
.act-btn.primary{background:var(--accent);color:#fff;}
.act-btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line);}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-hdr">
    <h1>MMSE</h1>
    <span class="sub">採点アプリ</span>
  </div>
  <div class="field">
    <label>イニシャル</label>
    <input id="ini" type="text" placeholder="例：A.T" maxlength="10">
  </div>
  <div class="field">
    <label>実施日時</label>
    <input id="dt" type="datetime-local">
  </div>
  <button class="go-btn" onclick="startExam()">開始</button>

  <div class="log-hdr">最近7日間の記録</div>
  <div id="log-list"><div class="log-empty">記録なし</div></div>
</div>

<!-- EXAM -->
<div class="screen" id="exam">
  <div class="exam-hdr">
    <div>
      <div class="who" id="ex-who"></div>
      <div class="dt2" id="ex-dt"></div>
    </div>
    <div style="display:flex;align-items:center;gap:.6rem;">
      <div class="live" id="ex-live">0 / 30</div>
      <button class="quit" onclick="quit()">中断</button>
    </div>
  </div>
  <div id="ex-body" style="width:100%;max-width:480px;"></div>
  <div class="bot-bar">
    <div class="bot-total">
      <div class="big" id="bar-n">0</div>
      <div class="denom">/ 30点</div>
    </div>
    <button class="done-btn" onclick="finish()">完了</button>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
  <div class="res-hero" id="r-hero">
    <div class="res-ini" id="r-ini"></div>
    <div class="res-big" id="r-big"></div>
    <div class="res-of">/ 30点</div>
    <div class="res-judge" id="r-judge"></div>
    <div class="res-dt" id="r-dt"></div>
  </div>
  <div id="r-det" style="width:100%;max-width:480px;"></div>
  <div class="act-col">
    <button class="act-btn primary" onclick="newExam()">続けて検査</button>
    <button class="act-btn ghost" onclick="goHome()">ホームへ</button>
  </div>
</div>

<script>
// ── 設問定義 ───────────────────────────────────────
// type:'check' = 1点トグル
// type:'partial' = 0〜max点をボタン選択
const SECS = [
  { label:'時間の見当識', items:[
    {id:'t1',q:'今年',      type:'check'},
    {id:'t2',q:'季節',      type:'check'},
    {id:'t3',q:'今日の日付', type:'check'},
    {id:'t4',q:'曜日',      type:'check'},
    {id:'t5',q:'月',        type:'check'},
  ]},
  { label:'場所の見当識', items:[
    {id:'p1',q:'都道府県',   type:'check'},
    {id:'p2',q:'市区町村',   type:'check'},
    {id:'p3',q:'施設の種類', type:'check'},
    {id:'p4',q:'階',        type:'check'},
    {id:'p5',q:'地方',      type:'check'},
  ]},
  { label:'即時記憶', items:[
    {id:'m1',q:'3語の即時再生', type:'partial', max:3},
  ]},
  { label:'注意と計算（100−7）', items:[
    {id:'c1',q:'5回の計算', type:'calc', max:5},
  ]},
  { label:'遅延再生', items:[
    {id:'d1',q:'3語の遅延再生', type:'partial', max:3},
  ]},
  { label:'呼称', items:[
    {id:'n1',q:'物品①（腕時計・ペンなど）', type:'check'},
    {id:'n2',q:'物品②（鍵・コップなど）',   type:'check'},
  ]},
  { label:'復唱', items:[
    {id:'r1',q:'文の復唱', type:'check'},
  ]},
  { label:'3段階命令', items:[
    {id:'o1',q:'紙を持つ', type:'check'},
    {id:'o2',q:'半分に折る', type:'check'},
    {id:'o3',q:'渡す',    type:'check'},
  ]},
  { label:'読字', items:[
    {id:'rd',q:'目を閉じる', type:'check'},
  ]},
  { label:'書字', items:[
    {id:'wr',q:'文を書く', type:'check'},
  ]},
  { label:'図形模写', items:[
    {id:'dr',q:'五角形の模写', type:'check'},
  ]},
];

// ── STATE ───────────────────────────────────────────
let sc = {};   // {id: number}
let session = null;

// ── STORAGE（7日間保持）────────────────────────────
const STORE_KEY = 'mmse_log_v1';
const KEEP_DAYS = 7;

function loadLog(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    const cutoff = Date.now() - KEEP_DAYS * 86400 * 1000;
    return arr.filter(r => r.ts && r.ts >= cutoff);
  } catch(e){ return []; }
}

function saveLog(arr){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); } catch(e){}
}

// ── INIT ────────────────────────────────────────────
window.onload = () => {
  const now = new Date();
  const loc = new Date(now - now.getTimezoneOffset()*60000);
  document.getElementById('dt').value = loc.toISOString().slice(0,16);
  renderLog();
};

// ── START ────────────────────────────────────────────
function startExam(){
  const ini = document.getElementById('ini').value.trim();
  const dt  = document.getElementById('dt').value;
  if(!ini){ alert('イニシャルを入力してください'); return; }

  session = {ini, dt};
  sc = {};
  calcOX = [null,null,null,null,null];
  SECS.forEach(s=>s.items.forEach(item=>{
    sc[item.id] = item.type==='check' ? 0 : null;
  }));

  document.getElementById('ex-who').textContent = ini;
  document.getElementById('ex-dt').textContent  = fmtDT(dt);
  buildExam();
  updTotal();
  show('exam');
}

// ── BUILD ────────────────────────────────────────────
function buildExam(){
  const body = document.getElementById('ex-body');
  body.innerHTML = '';

  SECS.forEach(sec=>{
    const lbl = document.createElement('div');
    lbl.className = 'sec-label';
    lbl.textContent = sec.label;
    body.appendChild(lbl);

    sec.items.forEach(item=>{
      if(item.type==='check'){
        body.appendChild(makeCheckRow(item));
      } else if(item.type==='calc'){
        body.appendChild(makeCalcRow(item));
      } else {
        body.appendChild(makePartialRow(item));
      }
    });
  });
}

function makeCheckRow(item){
  const row = document.createElement('div');
  row.className = 'item-row';
  row.id = 'row-'+item.id;
  row.innerHTML = `
    <div class="item-text">${h(item.q)}</div>
    <div class="item-check" id="chk-${item.id}">✓</div>
  `;
  row.onclick = () => toggleCheck(item.id);
  return row;
}

function toggleCheck(id){
  sc[id] = sc[id] ? 0 : 1;
  const row = document.getElementById('row-'+id);
  row.classList.toggle('on', sc[id]===1);
  updTotal();
}

// 計算専用行（正答表示 + ○×カウンター + 点数ボタン）
const CALC_ANSWERS = [93, 86, 79, 72, 65];
// 各問の○×状態（null=未入力, true=○, false=×）
let calcOX = [null,null,null,null,null];

function makeCalcRow(item){
  const wrap = document.createElement('div');
  wrap.className = 'calc-wrap';
  wrap.id = 'calc-wrap-'+item.id;

  // 上段：正答＋○×ボタン
  const ansRow = document.createElement('div');
  ansRow.className = 'calc-answers';

  CALC_ANSWERS.forEach((ans, i)=>{
    const col = document.createElement('div');
    col.className = 'calc-ans-item';

    const num = document.createElement('div');
    num.className = 'calc-ans-num';
    num.textContent = ans;

    const btn = document.createElement('button');
    btn.className = 'calc-ox-btn';
    btn.id = `cox-${i}`;
    btn.textContent = '−';
    btn.onclick = () => toggleOX(i, item.id, item.max);

    col.appendChild(num);
    col.appendChild(btn);
    ansRow.appendChild(col);
  });
  wrap.appendChild(ansRow);

  // 下段：点数表示 + 0〜5ボタン
  const bot = document.createElement('div');
  bot.className = 'calc-row-bottom';

  const lbl = document.createElement('div');
  lbl.className = 'calc-score-label';
  lbl.textContent = '点数';

  const right = document.createElement('div');
  right.style.display='flex';right.style.alignItems='center';right.style.gap='.35rem';

  const val = document.createElement('div');
  val.className = 'calc-total-val';
  val.id = 'pv-'+item.id;
  val.textContent = '− / 5';

  const btns = document.createElement('div');
  btns.className = 'calc-ptns';
  for(let v=0;v<=item.max;v++){
    const b = document.createElement('button');
    b.className = 'pt-btn';
    b.textContent = v;
    b.id = `pb-${item.id}-${v}`;
    b.onclick = () => setCalcManual(item.id, v, item.max);
    btns.appendChild(b);
  }

  right.appendChild(val);
  right.appendChild(btns);
  bot.appendChild(lbl);
  bot.appendChild(right);
  wrap.appendChild(bot);
  return wrap;
}

function toggleOX(i, id, max){
  // null→○→×→null の順に切り替え
  if(calcOX[i]===null) calcOX[i]=true;
  else if(calcOX[i]===true) calcOX[i]=false;
  else calcOX[i]=null;

  const btn = document.getElementById(`cox-${i}`);
  btn.textContent = calcOX[i]===null ? '−' : calcOX[i] ? '○' : '×';
  btn.className = 'calc-ox-btn' + (calcOX[i]===true?' ok':calcOX[i]===false?' ng':'');

  // ○の数を自動集計してsc & UIに反映
  const count = calcOX.filter(v=>v===true).length;
  setPartial(id, count, max);
}

function setCalcManual(id, val, max){
  // 手動ボタンで上書き → ○×表示はそのまま維持
  setPartial(id, val, max);
}

function makePartialRow(item){
  const div = document.createElement('div');
  div.className = 'partial-row';
  div.id = 'partial-'+item.id;

  const lbl = document.createElement('div');
  lbl.className = 'partial-label';
  lbl.textContent = item.q;
  div.appendChild(lbl);

  const val = document.createElement('div');
  val.className = 'partial-val';
  val.id = 'pv-'+item.id;
  val.textContent = '− / '+item.max;
  div.appendChild(val);

  const btns = document.createElement('div');
  btns.className = 'partial-btns';
  for(let v=0;v<=item.max;v++){
    const b = document.createElement('button');
    b.className = 'pt-btn';
    b.textContent = v;
    b.id = `pb-${item.id}-${v}`;
    b.onclick = () => setPartial(item.id, v, item.max);
    btns.appendChild(b);
  }
  div.appendChild(btns);
  return div;
}

function setPartial(id, val, max){
  sc[id] = val;
  document.getElementById('pv-'+id).textContent = val+' / '+max;
  for(let v=0;v<=max;v++){
    const b = document.getElementById(`pb-${id}-${v}`);
    if(b) b.classList.toggle('sel', v===val);
  }
  updTotal();
}

function updTotal(){
  let n=0;
  Object.values(sc).forEach(v=>{ if(v!==null) n+=v; });
  document.getElementById('ex-live').textContent = n+' / 30';
  document.getElementById('bar-n').textContent   = n;
}

function getTotal(){
  let n=0;
  Object.values(sc).forEach(v=>{ if(v) n+=v; });
  return n;
}

// ── FINISH ───────────────────────────────────────────
function finish(){
  // 未入力partialを0に
  SECS.forEach(s=>s.items.forEach(item=>{
    if((item.type==='partial'||item.type==='calc') && sc[item.id]===null) sc[item.id]=0;
  }));

  const total = getTotal();
  const rec = {ini:session.ini, dt:session.dt, total, sc:{...sc}, ts:Date.now()};
  const log = loadLog();
  log.unshift(rec);
  saveLog(log);
  renderLog();
  buildResult(rec);
  show('result');
}

function quit(){
  if(confirm('中断しますか？')) show('home');
}

// ── RESULT ───────────────────────────────────────────
function buildResult(rec){
  const hero=document.getElementById('r-hero');
  hero.className='res-hero';
  document.getElementById('r-ini').textContent   = rec.ini;
  document.getElementById('r-big').textContent   = rec.total;
  document.getElementById('r-judge').textContent = '';
  document.getElementById('r-dt').textContent    = fmtDT(rec.dt);

  const det=document.getElementById('r-det');
  det.innerHTML='';
  SECS.forEach(sec=>{
    const block=document.createElement('div');
    block.className='det-sec';
    const lbl=document.createElement('div');
    lbl.className='det-sec-lbl';
    lbl.textContent=sec.label;
    block.appendChild(lbl);
    sec.items.forEach(item=>{
      const v=rec.sc[item.id]||0;
      const max=item.type==='check'?1:item.max;
      const row=document.createElement('div');
      row.className='det-row';
      row.innerHTML=`<span class="det-q">${h(item.q)}</span><span class="det-sc">${v} / ${max}</span>`;
      block.appendChild(row);
    });
    det.appendChild(block);
  });
}

// ── LOG ──────────────────────────────────────────────
function renderLog(){
  const el=document.getElementById('log-list');
  const log=loadLog();
  if(!log.length){ el.innerHTML='<div class="log-empty">記録なし</div>'; return; }
  el.innerHTML='';
  log.forEach(rec=>{
    const s=rec.total;
    const row=document.createElement('div');
    row.className='log-row';
    row.onclick=()=>{ buildResult(rec); show('result'); };
    row.innerHTML=`
      <div class="log-left">
        <div class="ini">${h(rec.ini)}</div>
        <div class="dt">${fmtDT(rec.dt)}</div>
      </div>
      <div class="log-right">
        <div class="log-sc">${s}<span style="font-size:.68rem;font-weight:400;color:var(--muted)"> /30</span></div>
      </div>`;
    el.appendChild(row);
  });
}

// ── NAV ──────────────────────────────────────────────
function goHome(){ show('home'); }
function newExam(){
  document.getElementById('ini').value='';
  const now=new Date();
  const loc=new Date(now-now.getTimezoneOffset()*60000);
  document.getElementById('dt').value=loc.toISOString().slice(0,16);
  show('home');
  setTimeout(()=>document.getElementById('ini').focus(),100);
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function fmtDT(s){
  if(!s) return '';
  const d=new Date(s), p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function h(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
